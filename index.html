<!doctype html>
<html lang="mr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chetan Option Chain</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial;background:#f4f7f7;color:#17302d}
header{background:#075e54;color:white;padding:18px 14px}
h1{margin:0;font-size:25px}
.sub{margin-top:5px}
.controls{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
select,button{border:0;border-radius:12px;padding:14px 16px;font-size:16px}
select{background:white;min-width:145px}
button{background:#00d26a;color:#073b2d;font-weight:700}
.secondary{background:#004d40;color:white}
.card{background:white;border-radius:16px;margin:14px;padding:14px;box-shadow:0 2px 10px #0001}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{text-align:center;padding:14px;background:white;border-radius:14px}
.stat small{display:block;color:#70807d}
.stat b{font-size:20px}
.wrap{overflow:auto;margin:14px;border-radius:14px;background:white}
table{border-collapse:collapse;min-width:850px;width:100%}
th{background:#004d40;color:white;padding:10px}
td{padding:9px;text-align:center;border-bottom:1px solid #eee}
.atm{background:#fff0a8;font-weight:700}
.pos{color:#008a4b}
.neg{color:#c62828}
</style>
</head>

<body>

<header>
<h1>📊 Chetan Option Chain</h1>
<div class="sub">NIFTY / BANKNIFTY / FINNIFTY • FYERS</div>

<div class="controls">

<select id="symbol">
<option>NIFTY</option>
<option>BANKNIFTY</option>
<option>FINNIFTY</option>
</select>

<select id="expiry">
<option value="">Nearest Expiry</option>
</select>

<button id="refresh">↻ Refresh</button>
<button id="connect" class="secondary">Connect FYERS</button>

</div>
</header>

<div class="card" id="status">
Checking FYERS connection…
</div>

<div class="stats">

<div class="stat">
<small>Spot</small>
<b id="spot">—</b>
</div>

<div class="stat">
<small>ATM</small>
<b id="atm">—</b>
</div>

<div class="stat">
<small>PCR</small>
<b id="pcr">—</b>
</div>

<div class="stat">
<small>Max Pain</small>
<b id="maxpain">—</b>
</div>

</div>

<div class="wrap">

<table>

<thead>
<tr>
<th>CE OI</th>
<th>CE ΔOI</th>
<th>CE LTP</th>
<th>STRIKE</th>
<th>PE LTP</th>
<th>PE ΔOI</th>
<th>PE OI</th>
</tr>
</thead>

<tbody id="rows"></tbody>

</table>

</div>

<script>

const $=x=>document.getElementById(x);

let connected=false;

async function check(){

try{

let r=await fetch('/api/fyers/status',{cache:'no-store'});

let j=await r.json();

connected=!!j.connected;

$('status').textContent=

connected

?'🟢 FYERS connected — Live data ready.'

:'🟡 FYERS connect करा. Connect FYERS वर tap करा.';

}

catch(e){

$('status').textContent='🔴 Backend error';

}

}

$('connect').onclick=()=>location.href='/api/fyers/login';

$('refresh').onclick=load;

$('symbol').onchange=load;

async function load(){

if(!connected)return;

$('status').textContent='⏳ Loading live option chain…';

try{

let u='/api/option-chain?symbol='+

encodeURIComponent($('symbol').value),

r=await fetch(u,{cache:'no-store'}),

j=await r.json();

if(!r.ok)throw Error(j.error||'API error');

$('spot').textContent=j.spot??'—';

$('atm').textContent=j.atm??'—';

$('pcr').textContent=j.pcr??'—';

$('maxpain').textContent=j.maxPain??'—';

$('status').textContent='🟢 Live data updated';

$('rows').innerHTML=(j.rows||[]).map(x=>`

<tr class="${x.strike==j.atm?'atm':''}">

<td>${x.ceOI??'—'}</td>

<td>${x.ceChgOI??'—'}</td>

<td>${x.ceLTP??'—'}</td>

<td><b>${x.strike}</b></td>

<td>${x.peLTP??'—'}</td>

<td>${x.peChgOI??'—'}</td>

<td>${x.peOI??'—'}</td>

</tr>

`).join('');

}

catch(e){

$('status').textContent='🔴 '+e.message;

}

}

check().then(load);

</script>

</body>
</html>
